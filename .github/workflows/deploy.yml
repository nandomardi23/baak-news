name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────
  # Job 1: Build frontend assets
  # ──────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer Dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node Dependencies
        run: npm install

      - name: Build Production Assets
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: public/build/
          retention-days: 1

  # ──────────────────────────────────────────
  # Job 2: Deploy to Hostinger
  # ──────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: public/build/

      # Step 1: Git pull & composer install on server
      - name: Pull Latest Code on Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            php artisan down --retry=60 --refresh=15 || true
            git pull origin main
            rm -rf vendor
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress
            rm -rf public/build/*
            php artisan migrate --force

      # Step 2: Upload built assets to server
      - name: Upload Build Assets to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/build/*"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      # Step 3: Optimize & bring back online
      - name: Optimize & Go Live
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan storage:link 2>/dev/null || true
            php artisan queue:restart
            php artisan up
            echo "✅ Deployed successfully!"
            git log -1 --pretty=format:"%h - %s (%cr)" HEAD
